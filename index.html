<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>My algorithm training domain</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 引入 vue 主题，非常适合技术博客 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 微调一下侧边栏和主内容的宽度 */
    .sidebar { width: 260px; }
    .content { padding-top: 20px; }
  </style>
</head>
<body>
  <div id="app">正在加载笔记...</div>
  <script>
    window.$docsify = {
      name: 'Algorithm Blog',
      repo: 'kikoyida/algorithm-tracker', // 仓库名
      loadSidebar: true,  // 开启侧边栏（用于分类标签）
      subMaxLevel: 2,     // 自动提取 Markdown 里的二级标题做目录
      auto2top: true,     // 切换页面后自动回到顶部
      search: {
        paths: 'auto',
        placeholder: '搜索题解',
        noData: '找不到相关内容',
        depth: 3
      }
    }
  </script>
  <!-- Docsify 核心脚本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 一键复制代码插件（满足要求） -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- 语法高亮：C 和 C++ -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
