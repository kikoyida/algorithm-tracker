<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法训练追踪</title>
    <!-- 从 CDN 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* 模仿 GitHub 风格的简洁背景和字体 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 40px 20px; 
            background-color: #f6f8fa; 
            margin: 0;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 6px; 
            border: 1px solid #d0d7de;
        }
        h2 { 
            text-align: center; 
            color: #24292f; 
            margin-top: 0;
            margin-bottom: 30px;
        }
        /* 热力图容器 */
        #heatmap { 
            width: 100%; 
            height: 220px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Training Heatmap</h2>
        <div id="heatmap"></div>
    </div>

    <script>
        // 1. 模拟你未来的 data.json 数据
        // 实际部署时，这里会通过 fetch('data.json') 来动态获取
        const rawData = {
            "2026-07-28": { "codeforces": 1, "luogu": 2, "nowcoder": 0, "total": 3 },
            "2026-07-29": { "codeforces": 0, "luogu": 1, "nowcoder": 0, "total": 1 },
            "2026-07-30": { "codeforces": 3, "luogu": 2, "nowcoder": 1, "total": 6 },
            "2026-08-01": { "codeforces": 1, "luogu": 0, "nowcoder": 4, "total": 5 },
            "2026-08-05": { "codeforces": 0, "luogu": 0, "nowcoder": 8, "total": 8 },
            "2026-08-10": { "codeforces": 4, "luogu": 5, "nowcoder": 4, "total": 13 }
        };

        // 2. 将 JSON 对象转换为 ECharts 日历图需要的数组格式: [['2026-08-01', 5], ...]
        const chartData = Object.keys(rawData).map(date => {
            return [date, rawData[date].total];
        });

        // 3. 初始化 ECharts 实例
        const chart = echarts.init(document.getElementById('heatmap'));

        // 4. 配置 ECharts
        const option = {
            tooltip: {
                position: 'top',
                // 自定义悬浮框内容，展示各平台明细
                formatter: function (p) {
                    const date = p.data[0];
                    const total = p.data[1];
                    const detail = rawData[date];
                    if (!detail) return `${date}: 0 题`;
                    return `
                        <div style="font-weight:bold;margin-bottom:4px;">${date}</div>
                        总计 AC: <b>${total}</b> 题<br/>
                        <span style="color:#888;font-size:12px;">
                          CF: ${detail.codeforces} | 洛谷: ${detail.luogu} | 牛客: ${detail.nowcoder}
                        </span>
                    `;
                }
            },
            visualMap: {
                type: 'piecewise', // 分段型视觉映射
                orient: 'horizontal',
                left: 'right',
                top: 0,
                itemWidth: 14,
                itemHeight: 14,
                itemGap: 4,
                textStyle: { color: '#57606a', fontSize: 12 },
                // 完美复刻 GitHub 的 5 阶绿色主题
                pieces: [
                    { min: 10, label: 'More', color: '#216e39' },
                    { min: 5, max: 9, label: ' ', color: '#30a14e' },
                    { min: 1, max: 4, label: ' ', color: '#9be9a8' },
                    { value: 0, label: 'Less', color: '#ebedf0' }
                ],
                outOfRange: { color: '#ebedf0' } // 没有数据的日子显示默认浅灰
            },
            calendar: {
                top: 50,
                left: 30,
                right: 10,
                cellSize: ['auto', 16], // 宽度自适应，高度 16px
                range: '2026', // 展示 2026 全年
                itemStyle: {
                    borderWidth: 3,
                    borderColor: '#fff', // 方块之间的白色间隙
                    color: '#ebedf0'
                },
                splitLine: { show: false }, // 隐藏月份分割线
                yearLabel: { show: false }, // 隐藏年份文字
                dayLabel: {
                    nameMap: ['日', '一', '二', '三', '四', '五', '六'],
                    color: '#57606a',
                    fontSize: 12
                },
                monthLabel: {
                    nameMap: 'ZH', // 中文月份
                    color: '#57606a',
                    fontSize: 12
                }
            },
            series: {
                type: 'heatmap',
                coordinateSystem: 'calendar',
                data: chartData,
                // 给方块加上一点圆角，看起来更现代
                itemStyle: { borderRadius: 2 } 
            }
        };

        chart.setOption(option);
        
        // 窗口缩放时自适应重绘
        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
