<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>算法训练追踪</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 让首页的热力图容器看起来更协调 */
    .heatmap-container {
      width: 100%;
      margin: 20px 0 30px 0;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Algorithm Tracker',
      repo: 'kikoyida/algorithm-tracker',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      // 核心：利用 Docsify 插件钩子，在每次进入首页时自动把热力图 iframe 插入到主内容最上方
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            // 仅在首页（或根路径）自动注入热力图看板
            if (vm.route.path === '/' || vm.route.path === '/README') {
              const heatmapIframe = `
                <div class="heatmap-container">
                    <iframe src="heatmap.html" width="100%" height="240px" style="border: none; background: transparent;"></iframe>
                </div>
              `;
              // 用 JavaScript 在 Docsify 渲染出的 HTML 中精准寻找标题的结束位置，把热力图塞在标题下方
                if (vm.route.path === '/' || vm.route.path === '/README') {
                const heatmapIframe = `
                    <div class="heatmap-container" style="width: 100%; height: 250px; min-height: 250px; margin: 20px 0 30px 0;">
                        <iframe src="heatmap.html" width="100%" height="250px" style="border: none; background: transparent; display: block;"></iframe>
                    </div>
                `;
  
                // 寻找主标题或副标题的结束标签，把它插在下面
                if (html.includes('</p>')) {
                    // 如果文章里有段落，插在第一个段落后面
                    const parts = html.split('</p>');
                    return parts[0] + '</p>' + heatmapIframe + parts.slice(1).join('</p>');
                } else {
                    return heatmapIframe + html;
                }
            }
            return html;
            }
            return html;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
