<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法训练追踪</title>
    <!-- 从 CDN 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* 模仿 GitHub 风格的简洁背景和字体 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 40px 20px; 
            background-color: #f6f8fa; 
            margin: 0;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 6px; 
            border: 1px solid #d0d7de;
        }
        h2 { 
            text-align: center; 
            color: #24292f; 
            margin-top: 0;
            margin-bottom: 30px;
        }
        /* 热力图容器 */
        #heatmap { 
            width: 100%; 
            height: 220px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Training Heatmap</h2>
        <div id="heatmap"></div>
    </div>

    <script>
        // 初始化 ECharts 实例
        const chart = echarts.init(document.getElementById('heatmap'));

        // 使用 fetch 动态读取 GitHub Actions 生成的 data.json
        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应错误，无法加载 data.json');
                }
                return response.json();
            })
            .then(rawData => {
                // 1. 将 JSON 对象转换为 ECharts 日历图需要的数组格式: [['2026-08-01', 5], ...]
                const chartData = Object.keys(rawData).map(date => {
                    return [date, rawData[date].total];
                });

                // 获取当前年份，让日历图每年自动翻页
                const currentYear = new Date().getFullYear().toString();

                // 2. 配置 ECharts
                const option = {
                    tooltip: {
                        position: 'top',
                        // 自定义悬浮框内容，展示各平台明细
                        formatter: function (p) {
                            const date = p.data[0];
                            const total = p.data[1];
                            const detail = rawData[date];
                            if (!detail) return `${date}: 0 题`;
                            return `
                                <div style="font-weight:bold;margin-bottom:4px;">${date}</div>
                                总计 AC: <b>${total}</b> 题<br/>
                                <span style="color:#888;font-size:12px;">
                                  CF: ${detail.codeforces || 0} | 洛谷: ${detail.luogu || 0} | 牛客: ${detail.nowcoder || 0}
                                </span>
                            `;
                        }
                    },
                    visualMap: {
                        type: 'piecewise',
                        orient: 'horizontal',
                        left: 'right',
                        top: 0,
                        itemWidth: 14,
                        itemHeight: 14,
                        itemGap: 4,
                        textStyle: { color: '#57606a', fontSize: 12 },
                        pieces: [
                            { min: 10, label: 'More', color: '#216e39' },
                            { min: 5, max: 9, label: ' ', color: '#30a14e' },
                            { min: 1, max: 4, label: ' ', color: '#9be9a8' },
                            { value: 0, label: 'Less', color: '#ebedf0' }
                        ],
                        outOfRange: { color: '#ebedf0' }
                    },
                    calendar: {
                        top: 50,
                        left: 30,
                        right: 10,
                        cellSize: ['auto', 16],
                        range: currentYear, // 使用动态年份
                        itemStyle: {
                            borderWidth: 3,
                            borderColor: '#fff',
                            color: '#ebedf0'
                        },
                        splitLine: { show: false },
                        yearLabel: { show: false },
                        dayLabel: {
                            nameMap: ['日', '一', '二', '三', '四', '五', '六'],
                            color: '#57606a',
                            fontSize: 12
                        },
                        monthLabel: {
                            nameMap: 'ZH',
                            color: '#57606a',
                            fontSize: 12
                        }
                    },
                    series: {
                        type: 'heatmap',
                        coordinateSystem: 'calendar',
                        data: chartData,
                        itemStyle: { borderRadius: 2 } 
                    }
                };

                // 渲染图表
                chart.setOption(option);
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                document.getElementById('heatmap').innerHTML = '<p style="text-align:center;color:red;padding-top:50px;">无法加载刷题数据，请检查 data.json 是否存在。</p>';
            });
        
        // 窗口缩放时自适应重绘
        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
