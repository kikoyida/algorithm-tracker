<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <title>Algorithm Field — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5ee6a8;
      --canvas: #0b0d0f;
      --surface: #111418;
      --surface-raised: #171b20;
      --line: #252a31;
      --line-soft: rgba(255, 255, 255, .07);
      --text: #f2f4f7;
      --muted: #929aa5;
      --quiet: #606873;
      --accent: #5ee6a8;
      --danger: #ff7676;
      --sidebar-width: 272px;
      --base-font-size: 16px;
      --base-font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { background: var(--canvas); }
    body {
      color: var(--text);
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
    }

    .sidebar {
      background: rgba(11, 13, 15, .96);
      border-right: 1px solid var(--line);
      padding: 0 22px 28px;
    }
    .sidebar::before {
      content: "ALGORITHM FIELD";
      display: block;
      height: 78px;
      padding-top: 30px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font: 600 12px/1 var(--mono);
      letter-spacing: .14em;
    }
    .sidebar > h1 { display: none; }
    .sidebar-nav { padding: 22px 0 40px; }
    .sidebar ul { margin: 0; padding: 0; }
    .sidebar ul li { margin: 2px 0; }
    .sidebar ul li a {
      display: flex;
      align-items: center;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .01em;
      transition: background .16s ease, color .16s ease;
    }
    .sidebar ul li a::before {
      content: "";
      width: 5px;
      height: 5px;
      margin-right: 11px;
      border: 1px solid var(--quiet);
      border-radius: 50%;
    }
    .sidebar ul li a:hover { color: var(--text); background: var(--surface-raised); }
    .sidebar ul li.active > a { color: var(--accent); background: rgba(94,230,168,.08); border-right: 0; }
    .sidebar ul li.active > a::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 10px rgba(94,230,168,.35); }
    .sidebar-nav > p {
      margin: 26px 10px 8px;
      color: var(--quiet);
      font: 500 10px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .app-nav { top: 27px; right: 36px; margin: 0; }
    .app-nav a { color: var(--muted); font: 500 11px/1 var(--mono); letter-spacing: .08em; }
    .app-nav a:hover { color: var(--accent); }

    .content { left: var(--sidebar-width); padding-top: 0; }
    .markdown-section {
      max-width: 1040px;
      padding: 88px 56px 96px;
      color: #c8cdd4;
    }
    .markdown-section > h1:first-child {
      margin: 0 0 18px;
      color: var(--text);
      font-size: clamp(38px, 5vw, 72px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .markdown-section > h1:first-child::before {
      content: "TRAINING / OVERVIEW";
      display: block;
      margin-bottom: 24px;
      color: var(--accent);
      font: 500 11px/1 var(--mono);
      letter-spacing: .16em;
    }
    .markdown-section h2 {
      margin-top: 58px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 26px;
      letter-spacing: -.025em;
    }
    .markdown-section h3 { color: var(--text); }
    .markdown-section p, .markdown-section li { line-height: 1.82; }
    .markdown-section a { color: var(--accent); font-weight: 500; }
    .markdown-section blockquote {
      margin: 0 0 36px;
      padding: 0;
      border: 0;
      color: var(--muted);
      font-size: 17px;
    }
    .markdown-section blockquote p { font-weight: 400; }
    .markdown-section code { color: var(--accent); background: rgba(94,230,168,.08); font-family: var(--mono); }
    .markdown-section pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    .markdown-section pre > code { color: #d9dee5; background: transparent; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr { border-color: var(--line); background: transparent; }
    .markdown-section tr:nth-child(2n) { background: var(--surface); }
    .markdown-section th, .markdown-section td { border-color: var(--line); }

    .training-panel {
      overflow: hidden;
      margin: 30px 0 50px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(0,0,0,.22);
    }
    .training-panel__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      color: var(--quiet);
      font: 500 10px/1 var(--mono);
      letter-spacing: .12em;
    }
    .training-panel__status { color: var(--accent); }
    .training-panel iframe { display: block; width: 100%; height: 392px; border: 0; background: transparent; }

    .progress { background: var(--accent); height: 2px; }
    .search { border-bottom-color: var(--line); }
    .search input { color: var(--text); }
    .search .matching-post { border-bottom-color: var(--line); }
    .search .matching-post:hover { background: var(--surface); }
    .search .matching-post h2 { color: var(--text); }
    .github-corner svg { fill: var(--accent); color: var(--canvas); }

    @media (max-width: 768px) {
      .sidebar { padding-left: 18px; padding-right: 18px; }
      .sidebar-toggle { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .sidebar-toggle span { background: var(--accent); }
      .content { left: 0; }
      .markdown-section { padding: 84px 20px 64px; }
      .app-nav { top: 25px; right: 18px; }
      .training-panel { margin-left: -6px; margin-right: -6px; }
      .training-panel iframe { height: 420px; }
      body.close .sidebar-toggle { background: var(--surface); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app">SYSTEM INITIALIZING…</div>
  <script>
    window.$docsify = {
      name: '',
      repo: 'kikoyida/algorithm-tracker',
      homepage: 'README-preview.md',
      loadSidebar: '_sidebar-preview.md',
      subMaxLevel: 2,
      auto2top: true,
      notFoundPage: true,
      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            if (vm.route.path !== '/' && vm.route.path !== '/README-preview') return html;
            const panel = `
              <section class="training-panel" aria-label="年度训练数据">
                <div class="training-panel__bar">
                  <span>ACTIVITY / ${new Date().getFullYear()}</span>
                  <span class="training-panel__status">● DATA ONLINE</span>
                </div>
                <iframe src="heatmap-preview.html?t=${Date.now()}" title="年度算法训练热力图" loading="eager"></iframe>
              </section>`;
            const firstParagraphEnd = html.indexOf('</p>');
            return firstParagraphEnd >= 0
              ? html.slice(0, firstParagraphEnd + 4) + panel + html.slice(firstParagraphEnd + 4)
              : panel + html;
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
