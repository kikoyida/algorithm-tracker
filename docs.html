<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="Kikoyida 的个人技术主页、算法训练记录与知识库。">
  <title>Kikoyida — 技术与算法</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2f7657;
      --canvas: #f7f6f3;
      --paper: #fff;
      --paper-soft: #fbfaf8;
      --ink: #20231f;
      --body: #555a53;
      --muted: #7c8179;
      --quiet: #a4a89f;
      --line: #e5e4df;
      --line-strong: #d5d4ce;
      --accent: #2f7657;
      --accent-soft: #e7f0eb;
      --danger: #9f433d;
      --danger-soft: #f8e9e7;
      --sidebar-width: 292px;
      --base-font-size: 16px;
      --base-font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Geist Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0;
      color: var(--body);
      background:
        linear-gradient(rgba(32,35,31,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32,35,31,.025) 1px, transparent 1px),
        var(--canvas);
      background-size: 48px 48px;
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
    }

    .sidebar {
      width: var(--sidebar-width);
      padding: 0 24px 36px;
      border-right: 1px solid var(--line);
      background: rgba(247,246,243,.94);
      backdrop-filter: blur(12px);
    }
    .sidebar::before {
      content: "KIKOYIDA";
      display: flex;
      align-items: center;
      height: 78px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font: 600 14px/1 var(--mono);
      letter-spacing: .08em;
    }
    .sidebar > h1 { display: none; }
    .sidebar-nav { padding: 20px 0 48px; }
    .sidebar-nav > p {
      margin: 25px 9px 8px;
      color: var(--quiet);
      font: 500 10px/1 var(--mono);
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .sidebar ul { margin: 0; padding: 0; }
    .sidebar ul li { margin: 2px 0; }
    .sidebar ul li a {
      min-height: 38px;
      padding: 9px 10px;
      border-radius: 6px;
      color: var(--body);
      font-size: 13px;
      font-weight: 500;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .sidebar ul li a:hover { color: var(--ink); background: rgba(255,255,255,.72); transform: translateX(2px); }
    .sidebar ul li.active > a { color: var(--accent); background: var(--accent-soft); border-right: 0; }
    .sidebar-nav .sidebar-algorithms { margin: 8px 0; }
    .sidebar-nav .sidebar-algorithms summary { display: flex; align-items: center; justify-content: space-between; min-height: 38px; padding: 9px 10px; border-radius: 6px; color: var(--body); font-size: 13px; font-weight: 500; cursor: pointer; list-style: none; }
    .sidebar-nav .sidebar-algorithms summary::-webkit-details-marker { display: none; }
    .sidebar-nav .sidebar-algorithms summary::after { content: '+'; color: var(--quiet); font-size: 17px; line-height: 1; }
    .sidebar-nav .sidebar-algorithms[open] summary::after { content: '−'; }
    .sidebar-nav .sidebar-algorithms summary:hover { color: var(--ink); background: rgba(255,255,255,.72); }
    .sidebar-nav .sidebar-algorithms ul { padding-left: 12px; }

    .app-nav { top: 29px; right: 38px; margin: 0; }
    .app-nav a { color: var(--muted); font: 500 12px/1 var(--mono); letter-spacing: .02em; }
    .app-nav a:hover { color: var(--accent); }
    .content { left: var(--sidebar-width); padding-top: 0; }
    .markdown-section {
      max-width: 1120px;
      padding: 116px 64px 120px;
      color: var(--body);
    }
    .markdown-section > * { max-width: 760px; }
    .markdown-section > .home-hero,
    .markdown-section > .training-panel,
    .markdown-section > .home-grid,
    .markdown-section > .section-index { max-width: 100%; }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 { color: var(--ink); font-weight: 600; }
    .markdown-section h1 { font-size: clamp(38px, 5vw, 66px); line-height: 1.02; letter-spacing: -.055em; }
    .markdown-section h2 { margin: 72px 0 22px; font-size: 24px; letter-spacing: -.03em; }
    .markdown-section h3 { font-size: 17px; }
    .markdown-section p, .markdown-section li { line-height: 1.8; }
    .markdown-section a { color: var(--accent); font-weight: 500; }
    .markdown-section blockquote { margin: 24px 0; padding: 2px 0 2px 20px; border-left: 2px solid var(--accent); color: var(--muted); }
    .markdown-section code { border-radius: 4px; color: #2f684f; background: var(--accent-soft); font-family: var(--mono); }
    .markdown-section pre { border: 1px solid #2d332f; border-radius: 8px; background: #191d1a; box-shadow: none; }
    .markdown-section pre > code { color: #27313d; background: transparent; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr, .markdown-section th, .markdown-section td { border-color: var(--line); }
    .markdown-section tr:nth-child(2n) { background: var(--paper-soft); }

    .home-hero { padding-bottom: 52px; border-bottom: 1px solid var(--line); }
    .home-hero__kicker { margin: 0 0 23px; color: var(--accent); font: 500 11px/1 var(--mono); letter-spacing: .08em; }
    .home-hero h1 { max-width: 820px; margin: 0; }
    .home-hero__lead { max-width: 620px; margin: 24px 0 0; color: var(--body); font-size: 18px; line-height: 1.7; }
    .home-hero__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .home-action { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink) !important; background: rgba(255,255,255,.65); font: 500 13px/1 var(--base-font-family); text-decoration: none; transition: transform .16s ease, background .16s ease; }
    .home-action:hover { background: var(--paper); transform: translateY(-1px); }
    .home-action:active { transform: scale(.98); }
    .home-action--primary { border-color: var(--ink); color: #fff !important; background: var(--ink); }
    .home-action--primary:hover { background: #343833; }

    .training-panel { overflow: hidden; margin: 56px 0 0; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .training-panel__bar { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 18px; border-bottom: 1px solid var(--line); color: var(--muted); font: 500 11px/1 var(--mono); }
    .training-panel__status { color: var(--accent); }
    .training-panel iframe { display: block; width: 100%; height: 382px; border: 0; background: transparent; }

    .home-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; margin-top: 18px; }
    .home-card { padding: 28px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.74); }
    .home-card__label { color: var(--muted); font: 500 10px/1 var(--mono); letter-spacing: .08em; }
    .home-card h2 { margin: 28px 0 12px; font-size: 24px; }
    .home-card p { margin: 0; color: var(--muted); font-size: 14px; }
    .home-card__meta { margin-top: 24px; color: var(--accent); font: 500 11px/1.5 var(--mono); }
    .home-card__link { display: inline-block; margin-top: 28px; color: var(--ink) !important; font-size: 13px; text-decoration: none; }
    .home-card__link:hover { color: var(--accent) !important; }

    .section-index { margin-top: 18px; border-top: 1px solid var(--line); }
    .section-index a { display: grid; grid-template-columns: 130px 1fr auto; gap: 24px; align-items: center; min-height: 74px; border-bottom: 1px solid var(--line); color: var(--ink) !important; text-decoration: none; }
    .section-index a:hover .section-index__title { color: var(--accent); }
    .section-index__meta { color: var(--muted); font: 500 11px/1 var(--mono); }
    .section-index__title { font-size: 15px; transition: color .16s ease; }
    .section-index__arrow { color: var(--quiet); font-family: var(--mono); }

    .progress { height: 2px; background: var(--accent); }
    .search { border-bottom-color: var(--line); background: var(--canvas); }
    .search input { color: var(--ink); background: var(--paper); }
    .search .matching-post { border-bottom-color: var(--line); }
    .search .matching-post:hover { background: var(--paper); }
    .github-corner svg { fill: var(--ink); color: var(--canvas); }

    .reveal-block { opacity: 0; transform: translateY(10px); transition: opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1); }
    .reveal-block.is-visible { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .markdown-section { padding-right: 34px; padding-left: 34px; }
      .home-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { padding-right: 18px; padding-left: 18px; }
      .sidebar-toggle { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
      .sidebar-toggle span { background: var(--accent); }
      .content { left: 0; }
      .app-nav { top: 29px; right: 18px; }
      .markdown-section { padding: 96px 20px 80px; }
      .training-panel iframe { height: 430px; }
      .section-index a { grid-template-columns: 92px 1fr auto; gap: 12px; }
    }
    @media (max-width: 480px) {
      .home-hero h1 { font-size: 42px; }
      .home-hero__lead { font-size: 16px; }
      .home-action { width: 100%; justify-content: center; }
      .training-panel__bar { align-items: flex-start; flex-direction: column; justify-content: center; gap: 6px; }
      .section-index__meta { display: none; }
      .section-index a { grid-template-columns: 1fr auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .reveal-block { opacity: 1; transform: none; }
    }
    /* Shared silver-glass reading surface; navigation overlays the article. */
    :root{--theme-color:#3157e8;--canvas:#f5f6f7;--paper:#fff;--paper-soft:#f8f9fa;--ink:#17191d;--body:#4e535b;--muted:#7f858d;--line:#dfe2e5;--accent:#3157e8;--accent-soft:#d6e1ff66}
    body{background:var(--canvas);background-image:none}
    .reading-header{position:fixed;inset:0 0 auto;z-index:40;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 100px;border-bottom:1px solid #c8ccd173;background:#f7f8f9c9;backdrop-filter:blur(18px);font-size:12px}
    .reading-header a{color:var(--ink);text-decoration:none}.reading-header span{color:var(--muted)}
    .sidebar{z-index:50;top:68px;width:min(292px,88vw);background:#eff2f561;border-right:1px solid #ffffffc7;backdrop-filter:blur(19px) saturate(116%);transform:translateX(-104%);transition:transform .3s ease}
    .sidebar::before{content:'k';font-family:Geist,sans-serif;letter-spacing:0}.sidebar ul li a:hover{transform:none;box-shadow:none}
    body.close .sidebar{transform:translateX(-104%)}body.reader-nav-open .sidebar{transform:translateX(0)}
    .sidebar-toggle{display:none}.reader-menu{position:fixed;z-index:60;top:17px;left:24px;padding:9px 12px;border:1px solid #ffffffc7;border-radius:8px;background:#f8f9fa8f;color:#20242a;cursor:pointer}
    .content,body.close .content{left:0;padding-top:68px;transform:none;margin-left:0}
    .markdown-section{max-width:900px;margin:0 auto;padding:56px 36px 100px}.markdown-section h1{color:var(--ink);letter-spacing:-.035em}.markdown-section pre{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#eceff2}.github-corner{display:none}
    @media(max-width:768px){body .content,body.close .content{left:0;transform:none}.markdown-section{padding:38px 20px 70px}.reading-header{padding-right:20px}.reading-header span{display:none}}
    .markdown-section blockquote{color:#515c69;border-left-color:#9aabc0;background:#eaf0f5;padding:14px 20px;border-radius:0 8px 8px 0}
    .markdown-section code{color:#284c80;background:#e6ebf2}
    .markdown-section pre code{color:#27313d;background:transparent;text-shadow:none}
    .markdown-section pre .token{background:transparent;text-shadow:none}
    .markdown-section pre .token.comment,.markdown-section pre .token.prolog,.markdown-section pre .token.doctype,.markdown-section pre .token.cdata{color:#596675}
    .markdown-section pre .token.punctuation,.markdown-section pre .token.operator{color:#394758}
    .markdown-section pre .token.keyword,.markdown-section pre .token.boolean{color:#6240a0}
    .markdown-section pre .token.string,.markdown-section pre .token.char,.markdown-section pre .token.builtin{color:#20624b}
    .markdown-section pre .token.number,.markdown-section pre .token.constant{color:#93401f}
    .markdown-section pre .token.function,.markdown-section pre .token.class-name{color:#245da0}
    .markdown-section pre .token.variable,.markdown-section pre .token.property,.markdown-section pre .token.symbol{color:#733b69}
    .markdown-section pre:after{color:#536171}.docsify-copy-code-button{color:#344255!important;background:#e0e6ed!important}
    .article-index{margin-top:32px}.article-index__bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #cbd2da;color:#586575;font-size:11px;letter-spacing:.08em}
    .markdown-section .article-entry{display:grid;grid-template-columns:1fr auto;gap:24px;margin:20px 0;padding:28px;border:1px solid #d3dae2;border-radius:14px;background:linear-gradient(120deg,#ffffffdc,#f0f3f6c9);color:#222c37;text-decoration:none;box-shadow:inset 0 1px 0 #fff;transition:border-color .18s,background .18s}
    .markdown-section .article-entry:hover{border-color:#91a3ba;background:#fff}.article-entry:focus-visible{outline:2px solid #3157e8;outline-offset:4px}
    .article-entry__tags{display:flex;gap:8px;flex-wrap:wrap}.article-entry__tags span{padding:4px 8px;border:1px solid #d4dce5;border-radius:5px;color:#495b71;background:#edf1f6;font-size:10px;line-height:1.5}
    .markdown-section .article-entry h3{margin:18px 0 10px;color:#202b38;font-size:21px;line-height:1.45;letter-spacing:-.02em}.markdown-section .article-entry p{margin:0;color:#596575;font-size:13px;font-weight:400}
    .article-entry__read{display:block;margin-top:24px;color:#425d7c;font-size:11px}.article-entry__arrow{align-self:center;color:#536981;font-size:23px}
    @media(max-width:560px){.markdown-section .article-entry{padding:20px;gap:12px}.markdown-section .article-entry h3{font-size:18px}}
  </style>
</head>
<body>
  <header class="reading-header"><a href="index.html">k / 返回主页</a><span>NOTES &amp; ALGORITHMS</span></header>
  <button class="reader-menu" type="button" aria-expanded="false" aria-label="打开导航">菜单</button>
  <div id="app">正在整理训练记录…</div>
  <script>
    window.$docsify = {
      name: '',
      repo: 'kikoyida/algorithm-tracker',
      basePath: new URL('./', window.location.href).href,
      homepage: 'basics.md',
      relativePath: false,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0,
      auto2top: true,
      notFoundPage: true,
      search: { placeholder: '搜索知识库', noData: '没有找到相关内容', depth: 3 },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            const algorithmGroup = document.querySelector('.sidebar-nav .sidebar-algorithms');
            if (algorithmGroup) {
              const currentPath = vm.route.path;
              const activeLink = [...algorithmGroup.querySelectorAll('a')].find(link => link.getAttribute('href') === `#${currentPath}`);
              if (activeLink) {
                algorithmGroup.open = true;
                activeLink.setAttribute('aria-current', 'page');
              }
            }
            const nodes = document.querySelectorAll('.reveal-block');
            if (!('IntersectionObserver' in window)) {
              nodes.forEach(node => node.classList.add('is-visible'));
              return;
            }
            const observer = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  observer.unobserve(entry.target);
                }
              });
            }, { threshold: .08 });
            nodes.forEach(node => observer.observe(node));
          });
        }
      ]
    };
  </script>
  <script>
    const readerMenu=document.querySelector('.reader-menu');
    function closeReaderMenu(){document.body.classList.remove('reader-nav-open');readerMenu.setAttribute('aria-expanded','false');readerMenu.textContent='菜单'}
    readerMenu.addEventListener('click',()=>{const open=document.body.classList.toggle('reader-nav-open');readerMenu.setAttribute('aria-expanded',String(open));readerMenu.textContent=open?'关闭':'菜单'});
    document.addEventListener('click',event=>{if(event.target.closest('.sidebar a'))closeReaderMenu()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeReaderMenu()});
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
