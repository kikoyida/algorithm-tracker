<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年度训练活动</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#111418; --panel:#171b20; --line:#252a31; --text:#f2f4f7; --muted:#929aa5; --quiet:#606873; --accent:#5ee6a8; --danger:#ff7676; --mono:"JetBrains Mono",Consolas,monospace; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:transparent; color:var(--text); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding:20px 18px 14px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
    .stat { min-width:0; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.018); }
    .stat__label { color:var(--quiet); font:500 9px/1 var(--mono); letter-spacing:.12em; }
    .stat__value { display:block; margin-top:8px; color:var(--text); font:600 22px/1 var(--mono); }
    .stat:first-child .stat__value { color:var(--accent); }
    #heatmap { width:100%; height:245px; }
    .error { display:grid; min-height:230px; place-items:center; color:var(--muted); font:500 12px var(--mono); }
    .modal-overlay { display:none; position:fixed; inset:0; z-index:10; background:rgba(3,5,6,.72); backdrop-filter:blur(5px); }
    .modal { display:none; position:fixed; z-index:11; top:50%; left:50%; width:min(390px,calc(100% - 32px)); transform:translate(-50%,-50%); padding:22px; border:1px solid #30363e; border-radius:12px; background:#15191e; box-shadow:0 28px 90px rgba(0,0,0,.55); }
    .modal__eyebrow { color:var(--accent); font:500 9px/1 var(--mono); letter-spacing:.14em; }
    .modal h2 { margin:12px 0 20px; font:600 25px/1.1 var(--mono); letter-spacing:-.04em; }
    .modal__metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .metric { padding:13px; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:11px; }
    .metric strong { display:block; margin-top:6px; color:var(--text); font:600 20px/1 var(--mono); }
    .metric--ac strong { color:var(--accent); } .metric--try strong { color:var(--danger); }
    .section-label { margin:20px 0 9px; color:var(--quiet); font:500 9px/1 var(--mono); letter-spacing:.12em; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; min-height:24px; }
    .chip { padding:6px 9px; border:1px solid var(--line); border-radius:5px; color:#cbd1d8; background:#1b2026; font:500 10px/1 var(--mono); }
    .empty { color:var(--quiet); font-size:12px; }
    .close { width:100%; margin-top:20px; padding:11px; border:1px solid var(--line); border-radius:7px; color:var(--text); background:transparent; font:500 10px var(--mono); letter-spacing:.1em; cursor:pointer; }
    .close:hover { border-color:var(--accent); color:var(--accent); }
    @media(max-width:560px){ body{padding:14px 10px 8px}.stats{gap:6px}.stat{padding:10px}.stat__label{font-size:8px}.stat__value{font-size:17px}#heatmap{height:285px} }
  </style>
</head>
<body>
  <section class="stats" aria-label="训练摘要">
    <div class="stat"><span class="stat__label">ACCEPTED / YEAR</span><strong class="stat__value" id="totalAC">—</strong></div>
    <div class="stat"><span class="stat__label">ACTIVE DAYS</span><strong class="stat__value" id="activeDays">—</strong></div>
    <div class="stat"><span class="stat__label">CURRENT STREAK</span><strong class="stat__value" id="streak">—</strong></div>
  </section>
  <div id="heatmap" role="img" aria-label="年度算法训练热力图"></div>
  <div class="modal-overlay" id="overlay"></div>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalDate">
    <div class="modal__eyebrow">TRAINING RECORD</div>
    <h2 id="modalDate"></h2>
    <div class="modal__metrics">
      <div class="metric metric--ac">ACCEPTED<strong id="modalAC"></strong></div>
      <div class="metric metric--try">ATTEMPTS<strong id="modalTry"></strong></div>
    </div>
    <div class="section-label">PLATFORMS</div><div class="chips" id="platforms"></div>
    <div class="section-label">TAGS</div><div class="chips" id="tags"></div>
    <button class="close" id="closeButton" type="button">CLOSE / ESC</button>
  </section>
  <script>
    const year = new Date().getFullYear();
    const chartNode = document.getElementById('heatmap');
    const chart = echarts.init(chartNode, null, { renderer: 'canvas' });
    let records = {};

    function countStreak(data) {
      let cursor = new Date();
      const today = cursor.toISOString().slice(0,10);
      if (!data[today] || Number(data[today].ac || data[today].total || 0) === 0) cursor.setDate(cursor.getDate() - 1);
      let count = 0;
      while (true) {
        const key = cursor.toISOString().slice(0,10);
        if (!data[key] || Number(data[key].ac || data[key].total || 0) === 0) break;
        count += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return count;
    }

    function setSummary(data) {
      const yearly = Object.entries(data).filter(([date]) => date.startsWith(String(year)));
      document.getElementById('totalAC').textContent = yearly.reduce((sum,[,v]) => sum + Number(v.ac ?? v.total ?? 0), 0);
      document.getElementById('activeDays').textContent = yearly.filter(([,v]) => Number(v.ac ?? v.total ?? 0) > 0).length;
      document.getElementById('streak').textContent = countStreak(data) + 'D';
    }

    function render(data) {
      const compact = innerWidth < 560;
      const values = Object.entries(data).map(([date,detail]) => [date, Number(detail.ac ?? detail.total ?? 0)]);
      chart.setOption({
        animationDuration: 500,
        tooltip: {
          position:'top', confine:true, backgroundColor:'#090b0d', borderColor:'#30363e', borderWidth:1, padding:[10,12],
          textStyle:{color:'#f2f4f7',fontFamily:'JetBrains Mono',fontSize:11},
          formatter(p) { const d=data[p.data[0]]||{}; return `<span style="color:#929aa5">${p.data[0]}</span><br><b style="color:#5ee6a8">${d.ac ?? d.total ?? 0} AC</b> · <b style="color:#ff7676">${d.try ?? 0} TRY</b><br><span style="color:#606873">CLICK FOR DETAILS</span>`; }
        },
        visualMap: {
          type:'piecewise', orient:'horizontal', right:compact?'center':8, bottom:0, itemWidth:12, itemHeight:12, itemGap:5,
          text:['MORE','LESS'], textGap:8, textStyle:{color:'#606873',fontSize:9,fontFamily:'JetBrains Mono'},
          pieces:[
            {min:5,max:999,color:'#8affc5'},
            {min:3,max:4,color:'#27c985'},
            {min:1,max:2,color:'#236248'},
            {value:0,color:'#20252b'}
          ]
        },
        calendar: {
          top:compact?48:45, left:compact?40:56, right:compact?4:10, bottom:36, cellSize:['auto',compact?14:16], range:String(year),
          itemStyle:{borderWidth:3,borderColor:'#111418',color:'#20252b',borderRadius:2}, splitLine:{show:false}, yearLabel:{show:false},
          dayLabel:{nameMap:['S','M','T','W','T','F','S'],firstDay:1,color:'#606873',fontSize:9,fontFamily:'JetBrains Mono'},
          monthLabel:{nameMap:'EN',color:'#929aa5',fontSize:9,fontFamily:'JetBrains Mono'}
        },
        series:{type:'heatmap',coordinateSystem:'calendar',data:values}
      }, true);
    }

    function addChips(node, values) {
      node.innerHTML='';
      if (!values.length) { node.innerHTML='<span class="empty">NO RECORD</span>'; return; }
      values.forEach(value => { const chip=document.createElement('span'); chip.className='chip'; chip.textContent=value; node.appendChild(chip); });
    }
    function openModal(date, data) {
      if (!data) return;
      document.getElementById('modalDate').textContent=date.replaceAll('-','.');
      document.getElementById('modalAC').textContent=data.ac ?? data.total ?? 0;
      document.getElementById('modalTry').textContent=data.try ?? 0;
      addChips(document.getElementById('platforms'), [['CF',data.codeforces],['AT',data.atcoder],['LG',data.luogu],['NC',data.nowcoder]].filter(([,v])=>Number(v)>0).map(([k,v])=>`${k} ${v}`));
      addChips(document.getElementById('tags'), Array.isArray(data.tags)?data.tags:[]);
      document.getElementById('overlay').style.display='block'; document.getElementById('modal').style.display='block'; document.getElementById('closeButton').focus();
    }
    function closeModal(){ document.getElementById('overlay').style.display='none'; document.getElementById('modal').style.display='none'; }

    fetch('data.json', { cache:'no-store' }).then(r=>{if(!r.ok)throw new Error('DATA OFFLINE');return r.json();}).then(data=>{records=data;setSummary(data);render(data);}).catch(error=>{chart.dispose();chartNode.className='error';chartNode.textContent=error.message;});
    chart.on('click',p=>{if(p.componentType==='series')openModal(p.data[0],records[p.data[0]]);});
    document.getElementById('overlay').addEventListener('click',closeModal); document.getElementById('closeButton').addEventListener('click',closeModal);
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();});
    let resizeTimer; addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{chart.resize();if(Object.keys(records).length)render(records);},100);});
  </script>
</body>
</html>
