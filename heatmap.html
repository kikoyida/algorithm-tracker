<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算法训练追踪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root { --paper:#fff; --paper-soft:#fbfaf8; --ink:#20231f; --body:#555a53; --muted:#7c8179; --quiet:#a4a89f; --line:#e5e4df; --accent:#2f7657; --accent-soft:#e7f0eb; --danger:#9f433d; --danger-soft:#f8e9e7; --mono:"Geist Mono",Consolas,monospace; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; color:var(--ink); background:transparent; font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif; }
    body { padding:22px 20px 14px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; overflow:hidden; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:var(--line); }
    .stat { min-width:0; padding:14px 16px; background:var(--paper-soft); }
    .stat__label { color:var(--muted); font:500 10px/1.2 var(--mono); letter-spacing:.04em; }
    .stat__value { display:block; margin-top:9px; color:var(--ink); font:600 23px/1 var(--mono); }
    .stat:first-child .stat__value { color:var(--accent); }
    #heatmap { width:100%; height:244px; }
    .activity-legend { display:flex; justify-content:flex-end; gap:15px; margin:-3px 8px 2px; color:var(--muted); font:500 9px/1 var(--mono); }
    .activity-legend span { display:flex; align-items:center; gap:6px; }.activity-legend i { width:10px; height:10px; border-radius:3px; }
    .legend-algorithm { background:#67a584 }.legend-focus { background:#e5af76 }.legend-mixed { background:#8f9b66 }
    .error { display:grid; min-height:220px; place-items:center; color:var(--muted); font:500 12px var(--mono); }
    .modal-overlay { display:none; position:fixed; inset:0; z-index:10; background:rgba(32,35,31,.24); backdrop-filter:blur(3px); }
    .modal { display:none; position:fixed; z-index:11; top:50%; left:50%; width:min(390px,calc(100% - 32px)); transform:translate(-50%,-50%); padding:24px; border:1px solid var(--line); border-radius:10px; background:var(--paper); box-shadow:0 24px 70px rgba(40,45,40,.13); }
    .modal__label { color:var(--accent); font:500 10px/1 var(--mono); letter-spacing:.06em; }
    .modal h2 { margin:12px 0 21px; color:var(--ink); font:600 25px/1.1 var(--mono); letter-spacing:-.035em; }
    .modal__metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .metric { padding:13px; border:1px solid var(--line); border-radius:7px; color:var(--muted); font-size:11px; background:var(--paper-soft); }
    .metric strong { display:block; margin-top:7px; color:var(--ink); font:600 20px/1 var(--mono); }
    .metric--ac { background:var(--accent-soft); }.metric--ac strong { color:var(--accent); }
    .metric--try { background:var(--danger-soft); }.metric--try strong { color:var(--danger); }
    .metric--focus strong { color:var(--accent); }
    .section-label { margin:20px 0 9px; color:var(--muted); font:500 10px/1 var(--mono); letter-spacing:.04em; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; min-height:25px; }
    .chip { padding:6px 9px; border:1px solid var(--line); border-radius:999px; color:var(--body); background:var(--paper-soft); font:500 10px/1 var(--mono); }
    .empty { color:var(--quiet); font-size:12px; }
    .tasks { display:grid; gap:7px; max-height:112px; overflow:auto; }
    .task { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); color:var(--body); font-size:12px; }
    .task:last-child { border-bottom:0; }.task time { flex:none; color:var(--muted); font:500 10px var(--mono); }
    .close { width:100%; margin-top:22px; padding:11px; border:1px solid var(--ink); border-radius:6px; color:#fff; background:var(--ink); font:500 12px/1 Geist,sans-serif; cursor:pointer; }
    .close:hover { background:#343833; }.close:active { transform:scale(.98); }.close:focus-visible { outline:3px solid rgba(47,118,87,.24); outline-offset:2px; }
    @media(max-width:560px){ body{padding:14px 10px 8px}.stats{grid-template-columns:repeat(2,1fr);gap:1px}.stat{padding:10px 9px}.stat__label{font-size:8px}.stat__value{font-size:17px}#heatmap{height:288px}.activity-legend{justify-content:center;margin-top:2px} }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="stats" aria-label="训练摘要">
    <div class="stat"><span class="stat__label">今年通过</span><strong class="stat__value" id="totalAC">—</strong></div>
    <div class="stat"><span class="stat__label">活跃天数</span><strong class="stat__value" id="activeDays">—</strong></div>
    <div class="stat"><span class="stat__label">连续训练</span><strong class="stat__value" id="streak">—</strong></div>
    <div class="stat"><span class="stat__label">今年专注</span><strong class="stat__value" id="focusTime">—</strong></div>
  </section>
  <div class="activity-legend" aria-label="热力图颜色说明"><span><i class="legend-algorithm"></i>算法</span><span><i class="legend-focus"></i>其他专注</span><span><i class="legend-mixed"></i>两者都有</span></div>
  <div id="heatmap" role="img" aria-label="年度算法训练热力图"></div>
  <div class="modal-overlay" id="overlay"></div>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalDate">
    <div class="modal__label">训练记录</div>
    <h2 id="modalDate"></h2>
    <div class="modal__metrics">
      <div class="metric metric--ac">通过<strong id="modalAC"></strong></div>
      <div class="metric metric--try">尝试<strong id="modalTry"></strong></div>
      <div class="metric metric--focus">专注<strong id="modalFocus"></strong></div>
      <div class="metric">专注次数<strong id="modalSessions"></strong></div>
    </div>
    <div class="section-label">平台</div><div class="chips" id="platforms"></div>
    <div class="section-label">标签</div><div class="chips" id="tags"></div>
    <div class="section-label">Ethereal Focus 任务</div><div class="tasks" id="focusTasks"></div>
    <button class="close" id="closeButton" type="button">关闭</button>
  </section>
  <script>
    const year = new Date().getFullYear();
    const chartNode = document.getElementById('heatmap');
    const chart = echarts.init(chartNode, null, { renderer: 'canvas' });
    let records = {};
    let lastFocused = null;

    function countStreak(data) {
      const cursor = new Date();
      const today = cursor.toISOString().slice(0,10);
      if (!data[today] || Number(data[today].ac ?? data[today].total ?? 0) === 0) cursor.setDate(cursor.getDate() - 1);
      let count = 0;
      while (true) {
        const key = cursor.toISOString().slice(0,10);
        if (!data[key] || Number(data[key].ac ?? data[key].total ?? 0) === 0) break;
        count += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return count;
    }

    function setSummary(data) {
      const yearly = Object.entries(data).filter(([date]) => date.startsWith(String(year)));
      document.getElementById('totalAC').textContent = yearly.reduce((sum,[,v]) => sum + Number(v.ac ?? v.total ?? 0), 0);
      document.getElementById('activeDays').textContent = yearly.filter(([,v]) => Number(v.ac ?? v.total ?? 0) > 0).length;
      document.getElementById('streak').textContent = countStreak(data) + ' 天';
      document.getElementById('focusTime').textContent = formatDuration(yearly.reduce((sum,[,v]) => sum + Number(v.focusSeconds || 0), 0));
    }

    function formatDuration(seconds) {
      const minutes=Math.round(Number(seconds||0)/60),hours=Math.floor(minutes/60),rest=minutes%60;
      return hours ? `${hours}h${rest ? ` ${rest}m` : ''}` : `${minutes}m`;
    }

    function mergeFocus(training, payload) {
      const merged=Object.fromEntries(Object.entries(training).map(([date,detail])=>[date,{...detail}]));
      for (const session of payload.sessions || []) {
        const date=session.localDate || String(session.completedAt || '').slice(0,10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        const detail=merged[date] ||= {ac:0,try:0,tags:[],codeforces:0,atcoder:0,luogu:0,nowcoder:0,total:0};
        detail.focusSeconds=Number(detail.focusSeconds||0)+Number(session.durationSeconds||0);
        detail.focusSessions=Number(detail.focusSessions||0)+1;
        (detail.focusTasks ||= []).push({name:session.taskName||'Untitled focus',seconds:Number(session.durationSeconds||0)});
      }
      return merged;
    }

    function activityValue(detail) {
      const ac=Number(detail.ac ?? detail.total ?? 0),focus=Number(detail.focusSeconds||0);
      const algorithmLevel=ac>=5?3:ac>=3?2:ac>0?1:0;
      const focusLevel=focus>=7200?3:focus>=1800?2:focus>0?1:0;
      if (algorithmLevel&&focusLevel) return 6+Math.max(algorithmLevel,focusLevel);
      if (focusLevel) return 3+focusLevel;
      return algorithmLevel;
    }

    function render(data) {
      const compact = innerWidth < 560;
      const values = Object.entries(data).map(([date,detail]) => [date, activityValue(detail)]);
      chart.setOption({
        animationDuration: 420,
        tooltip: {
          position:'top', confine:true, backgroundColor:'#20231f', borderWidth:0, padding:[10,12],
          textStyle:{color:'#fff',fontFamily:'Geist Mono',fontSize:11},
          formatter(p) { const d=data[p.data[0]]||{},focus=d.focusSeconds?`<br><b style="color:#92c5a9">${formatDuration(d.focusSeconds)} FOCUS</b>`:''; return `<span style="color:#c8cdc6">${p.data[0]}</span><br><b style="color:#92c5a9">${d.ac ?? d.total ?? 0} AC</b> · <b style="color:#e7aaa5">${d.try ?? 0} TRY</b>${focus}<br><span style="color:#c8cdc6">点击查看详情</span>`; }
        },
        visualMap: {
          type:'piecewise', show:false,
          pieces:[
            {value:9,color:'#586f45'},{value:8,color:'#8f9b66'},{value:7,color:'#c8c48e'},
            {value:6,color:'#c77b3e'},{value:5,color:'#e5af76'},{value:4,color:'#f3d5b3'},
            {value:3,color:'#2f7657'},{value:2,color:'#67a584'},{value:1,color:'#b3d2c0'},{value:0,color:'#efeee9'}
          ]
        },
        calendar: {
          top:compact?48:44, left:compact?28:55, right:compact?8:16, bottom:12, cellSize:['auto',compact?15:17], range:String(year),
          itemStyle:{borderWidth:3,borderColor:'#fff',color:'#efeee9',borderRadius:5}, splitLine:{show:false}, yearLabel:{show:false},
          dayLabel:{firstDay:1,nameMap:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],color:'#a4a89f',fontSize:9,fontFamily:'Geist Mono'},
          monthLabel:{nameMap:'ZH',color:'#7c8179',fontSize:10,fontFamily:'Geist Mono',margin:12}
        },
        series:{
          type:'heatmap',
          coordinateSystem:'calendar',
          data:values,
          itemStyle:{borderWidth:3,borderColor:'#fff',borderRadius:5},
          emphasis:{itemStyle:{borderWidth:2,borderColor:'#2f7657',borderRadius:5}}
        }
      }, true);
    }

    function chips(id, items) {
      const node=document.getElementById(id); node.innerHTML='';
      if (!items.length) { node.innerHTML='<span class="empty">暂无记录</span>'; return; }
      items.forEach(item => { const span=document.createElement('span'); span.className='chip'; span.textContent=item; node.appendChild(span); });
    }
    function openModal(date) {
      const d=records[date]; if(!d)return;
      lastFocused=document.activeElement;
      document.getElementById('modalDate').textContent=date;
      document.getElementById('modalAC').textContent=d.ac ?? d.total ?? 0;
      document.getElementById('modalTry').textContent=d.try ?? 0;
      document.getElementById('modalFocus').textContent=formatDuration(d.focusSeconds||0);
      document.getElementById('modalSessions').textContent=d.focusSessions||0;
      const platforms=[];
      [['Codeforces','codeforces'],['AtCoder','atcoder'],['洛谷','luogu'],['牛客','nowcoder']].forEach(([label,key])=>{if(d[key])platforms.push(`${label} ${d[key]}`)});
      chips('platforms',platforms); chips('tags',Array.isArray(d.tags)?d.tags:[]);
      const taskNode=document.getElementById('focusTasks');taskNode.innerHTML='';
      if (!d.focusTasks?.length) taskNode.innerHTML='<span class="empty">暂无专注任务</span>';
      else d.focusTasks.forEach(task=>{const row=document.createElement('div');row.className='task';const name=document.createElement('span');name.textContent=task.name;const time=document.createElement('time');time.textContent=formatDuration(task.seconds);row.append(name,time);taskNode.appendChild(row)});
      document.getElementById('overlay').style.display='block'; document.getElementById('modal').style.display='block';
      document.getElementById('closeButton').focus();
    }
    function closeModal() { document.getElementById('overlay').style.display='none'; document.getElementById('modal').style.display='none'; if(lastFocused?.focus)lastFocused.focus(); }

    Promise.all([
      fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()}),
      fetch('focus-data.json',{cache:'no-store'}).then(r=>r.ok?r.json():{sessions:[]}).catch(()=>({sessions:[]}))
    ]).then(([training,focus])=>{records=mergeFocus(training,focus);setSummary(records);render(records);chart.on('click',p=>{if(p.componentType==='series')openModal(p.data[0])})}).catch(()=>{chartNode.innerHTML='<div class="error">训练数据暂时无法读取</div>'});
    window.addEventListener('resize',()=>{chart.resize();render(records)});
    document.getElementById('overlay').addEventListener('click',closeModal);
    document.getElementById('closeButton').addEventListener('click',closeModal);
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
  </script>
</body>
</html>
