<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法训练追踪</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #10b981;
        }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0;
            padding: 0;
        }
        #heatmap { 
            width: 100%; 
            height: 320px; 
        }
        .custom-tooltip {
            background: rgba(17, 24, 39, 0.9) !important;
            backdrop-filter: blur(8px);
            border: none !important;
            border-radius: 12px !important;
            color: #fff !important;
            padding: 12px 16px !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }
        /* Tag 详情弹窗样式 */
        #tagModal {
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            z-index: 1000; 
            width: 320px;
            font-family: 'Inter', sans-serif;
            border: 1px solid #e5e7eb;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            backdrop-filter: blur(2px);
        }
        .tag-badge {
            background: #e0e7ff;
            color: #4f46e5;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="heatmap"></div>

    <!-- 弹窗遮罩与主体 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div id="tagModal">
        <h3 id="modalDate" style="margin-top:0; margin-bottom:12px; color:#111827;"></h3>
        <div style="font-size: 14px; margin-bottom: 16px; color:#4b5563;">
            <span style="display:inline-block; margin-right:16px;">✅ AC: <strong id="modalAC" style="color:#10b981;"></strong></span>
            <span>❌ Try: <strong id="modalTry" style="color:#ef4444;"></strong></span>
        </div>
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color:#374151;">训练标签:</div>
        <div id="modalTags" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        <button onclick="closeModal()" style="margin-top:20px; width:100%; padding:10px; background:#f3f4f6; color:#4b5563; font-weight:600; border:none; border-radius:8px; cursor:pointer; transition:background 0.2s;">关闭</button>
    </div>

    <script>
        const chart = echarts.init(document.getElementById('heatmap'));
        let globalData = {}; // 存储全局数据供点击事件调用

        fetch('data.json')
            .then(response => response.ok ? response.json() : Promise.reject('Failed to load'))
            .then(rawData => {
                globalData = rawData;
                
                // 将数据转为 ECharts 数组格式，热力图深度基于 AC 数量
                const chartData = Object.keys(rawData).map(date => {
                    const acCount = rawData[date].ac !== undefined ? rawData[date].ac : (rawData[date].total || 0);
                    return [date, acCount];
                });
                const currentYear = new Date().getFullYear().toString();

                const option = {
                    tooltip: {
                        position: 'top',
                        confine: true,         // 防切割
                        className: 'custom-tooltip',
                        formatter: function (p) {
                            const date = p.data[0];
                            const detail = rawData[date];
                            if (!detail) return `${date}<br/>No Record`;
                            
                            const ac = detail.ac !== undefined ? detail.ac : (detail.total || 0);
                            const tries = detail.try || 0;

                            return `
                                <div style="font-family:'Inter',sans-serif;">
                                    <div style="font-size:13px; color:#9ca3af; margin-bottom:6px;">${date}</div>
                                    <div style="font-size:15px; font-weight:600; margin-bottom:4px;">✅ AC: <span style="color:#10b981;">${ac}</span></div>
                                    <div style="font-size:15px; font-weight:600; margin-bottom:8px;">❌ Try: <span style="color:#f87171;">${tries}</span></div>
                                    <div style="font-size:11px; color:#d1d5db;">(点击方块查看 Tag 详情)</div>
                                </div>
                            `;
                        }
                    },
                    visualMap: {
                        type: 'piecewise',
                        orient: 'horizontal',
                        left: 'right',
                        bottom: 0,
                        itemWidth: 16,
                        itemHeight: 16,
                        itemGap: 6,
                        textStyle: { color: '#6b7280', fontSize: 13, fontFamily: 'Inter' },
                        // 满足要求：3题及以上中等深度，5题及以上最深
                        pieces: [
                            { min: 5, label: 'More', color: '#047857' },    
                            { min: 3, max: 4, label: ' ', color: '#10b981' }, 
                            { min: 1, max: 2, label: ' ', color: '#6ee7b7' }, 
                            { value: 0, label: 'Less', color: '#f3f4f6' }     
                        ],
                        outOfRange: { color: '#f3f4f6' }
                    },
                    calendar: {
                        top: 100,
                        left: 80,
                        right: 10,
                        cellSize: ['auto', 18],
                        range: currentYear,
                        itemStyle: {
                            borderWidth: 4,
                            borderColor: '#ffffff',
                            color: '#f3f4f6',
                            borderRadius: 4 
                        },
                        splitLine: { show: false },
                        yearLabel: { show: false },
                        dayLabel: {
                            nameMap: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                            color: '#9ca3af',
                            fontSize: 12,
                            fontFamily: 'Inter'
                        },
                        monthLabel: {
                            nameMap: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                            color: '#6b7280',
                            fontSize: 13,
                            fontFamily: 'Inter',
                            fontWeight: 600
                        }
                    },
                    series: {
                        type: 'heatmap',
                        coordinateSystem: 'calendar',
                        data: chartData
                    }
                };
                chart.setOption(option);

                // 绑定点击事件触发弹窗
                chart.on('click', function (params) {
                    if (params.componentType === 'series') {
                        const date = params.data[0];
                        openModal(date, globalData[date]);
                    }
                });
            });
        
        window.addEventListener('resize', () => chart.resize());

        function openModal(date, data) {
            if (!data) return;
            
            document.getElementById('modalDate').innerText = date;
            document.getElementById('modalAC').innerText = data.ac !== undefined ? data.ac : (data.total || 0);
            document.getElementById('modalTry').innerText = data.try || 0;
            
            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = '';
            
            if (data.tags && data.tags.length > 0) {
                data.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag-badge';
                    span.innerText = tag;
                    tagsContainer.appendChild(span);
                });
            } else {
                tagsContainer.innerHTML = '<span style="color:#9ca3af; font-size:13px;">无具体标签记录</span>';
            }

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('tagModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('tagModal').style.display = 'none';
        }
    </script>
</body>
</html>
